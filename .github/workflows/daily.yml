name: daily-fear-signal

on:
  schedule:
    - cron: "37 22 * * 1-5"   # 每個美股交易日收盤後 (台北時間 週二～週六 06:37)
  workflow_dispatch:          # 可在 Actions 頁面手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 更新資料庫與燈號
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python fear_signal.py
      - name: 提交更新
        run: |
          git config user.name "fear-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          git push
